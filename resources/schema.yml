resources:
  schemas:
    analytics_schema:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: Contact centre transcript analytics managed by Databricks Asset Bundles. Synthetic demo data only; contains no real personal data.
      grants:
        - principal: ${var.runtime_service_principal_name}
          privileges:
            - USE_SCHEMA
            - CREATE_TABLE
            - CREATE_VOLUME
            - APPLY_TAG
            - SELECT
            - MODIFY
        - principal: ${var.deploy_service_principal_name}
          privileges:
            - USE_SCHEMA
            - CREATE_TABLE
            - CREATE_VOLUME
            - MANAGE

  volumes:
    raw_transcripts:
      name: raw_transcripts
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.analytics_schema.name}
      volume_type: MANAGED
      comment: Synthetic Amazon Connect Contact Lens JSON landing area. Synthetic demo data only; contains no real personal data.
      grants:
        - principal: ${var.runtime_service_principal_name}
          privileges:
            - READ_VOLUME
            - WRITE_VOLUME
        - principal: ${var.deploy_service_principal_name}
          privileges:
            - MANAGE
