[project]
name = "connect-transcript-analysis-genie"
version = "0.1.0"
description = "Amazon Connect transcripts to a Unity Catalog metric view and Genie, scored through a Unity AI Gateway model service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.74.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connect_sentiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Databricks workspace (deselect with -m 'not integration')",
]

[tool.uv]
default-groups = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402", "F821"]
"scripts/generate_synthetic_data.py" = ["E402"]
