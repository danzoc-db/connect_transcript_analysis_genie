name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # Recommended with GitHub OIDC workload identity federation:
  # id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.DATABRICKS_RUNNER || 'ubuntu-latest' }}
    environment: production
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      # Recommended alternative after configuring workload identity federation:
      # DATABRICKS_AUTH_TYPE: github-oidc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      - name: Validate production bundle
        run: databricks bundle validate -t prod
      - name: Ensure the parked PT endpoint exists
        run: >-
          uv run python scripts/manage_pt_endpoint.py
          --units 0
          --runtime-principal "${{ vars.DATABRICKS_RUNTIME_CLIENT_ID }}"
      - name: Deploy production bundle
        run: databricks bundle deploy -t prod
      - name: Run end-to-end production workflow
        run: databricks bundle run -t prod connect_transcript_sentiment_job
