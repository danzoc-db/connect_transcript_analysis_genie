name: CI

on:
  pull_request:
  workflow_dispatch:

# Offline checks only. This public repository is not connected to any Databricks workspace and
# holds no workspace credentials. To deploy from your own fork, start from
# templates/github-actions/deploy.yml.template.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      - name: Lint
        run: uvx ruff check . && uvx ruff format --check .
      - name: Test
        run: uv run --group dev pytest -q
      - name: Verify bundle schema is available
        run: databricks bundle schema >/dev/null
